<!-- Google Analytics (GA4), loaded only for real visitors:
     automated browsers are skipped and the tag loads after the first user interaction
     (scroll, mouse, touch, key or click) or after 20 s with the tab visible. -->
{% if site.ga %}
  <script>
    (function () {
      var ID = '{{ site.ga.id }}';
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { dataLayer.push(arguments); };
      var ua = navigator.userAgent || '';
      if (navigator.webdriver || /HeadlessChrome|PhantomJS|Lighthouse|bot|crawl|spider|slurp|python|curl|wget|java\//i.test(ua)) { return; }
      var loaded = false;
      var events = ['scroll', 'mousemove', 'touchstart', 'keydown', 'click'];
      function load() {
        if (loaded) { return; }
        loaded = true;
        events.forEach(function (e) { removeEventListener(e, load, true); });
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + ID;
        document.head.appendChild(s);
        gtag('js', new Date());
        gtag('config', ID);
      }
      events.forEach(function (e) { addEventListener(e, load, { capture: true, passive: true }); });
      setTimeout(function () { if (document.visibilityState === 'visible') { load(); } }, 20000);
    })();
  </script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', '{{ site.ga.id }}');
  </script>
  <!-- Custom GA4 events: CV downloads, contact clicks and project clicks -->
  <script>
    document.addEventListener('click', function (e) {
      var a = e.target.closest ? e.target.closest('a[href]') : null;
      if (!a || typeof gtag !== 'function') return;
      var href = a.getAttribute('href') || '';
      var url;
      try { url = new URL(a.href, location.href); } catch (err) { return; }
      var send = function (name, params) {
        params.link_url = a.href;
        params.transport_type = 'beacon';
        gtag('event', name, params);
      };
      if (/\/cv\.pdf$/i.test(url.pathname)) {
        send('cv_download', { file_name: 'cv.pdf' });
      } else if (/\/cv\.html$/i.test(url.pathname)) {
        send('cv_view', { file_name: 'cv.html' });
      } else if (href.indexOf('mailto:') === 0) {
        send('contact_click', { method: 'email' });
      } else if (url.hostname.indexOf('linkedin.com') !== -1) {
        send('contact_click', { method: 'linkedin' });
      } else if (url.hostname === 'github.com' || url.hostname === 'gitlab.com') {
        var parts = url.pathname.split('/').filter(Boolean);
        if (parts.length >= 2) {
          send('project_click', { project_name: parts[0] + '/' + parts[1], host: url.hostname });
        } else {
          send('contact_click', { method: url.hostname.split('.')[0] });
        }
      } else if (url.hostname === 'testops.tech') {
        send('blog_click', { destination: url.pathname });
      }
    }, true);
  </script>
{% endif %}

<!-- GrowingIO -->
{% if site.gio %}
  <script>
    var _vds = _vds || [];
    window._vds = _vds;
    (function(){
      _vds.push(['setAccountId', '{{ site.gio.id }}']);
      (function() {
        var vds = document.createElement('script');
        vds.type = 'text/javascript';
        vds.async = true;
        vds.src = 'https://dn-growing.qbox.me/vds.js';  // Ensuring HTTPS
        var s = document.getElementsByTagName('script')[0];
        s.parentNode.insertBefore(vds, s);
      })();
    })();
  </script>
{% endif %}
