{%- comment -%}
  Responsive, lazy-loaded, privacy-friendly YouTube embed.
  Usage: {% include youtube.html id="VIDEO_ID" title="Video title" %}
{%- endcomment -%}
<div class="video-embed" style="position:relative;width:100%;aspect-ratio:16/9;margin:1.5rem 0;">
  <iframe src="https://www.youtube-nocookie.com/embed/{{ include.id }}" title="{{ include.title | escape }}" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;border:0;" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</div>
